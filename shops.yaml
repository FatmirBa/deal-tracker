# Shops the tracker checks.
# search: URL with {q} where the search words go. Leave it out and the tracker finds it by itself
#         (the result is cached in data/discovered.json).
# kinds:  which watchlist items this shop is searched for (appliances, furniture, everything).
# render: true for shops that only show products after JavaScript runs.
# selectors: optional CSS selectors if automatic extraction misses (card/title/price/old_price/link).

delay_seconds: 1.5

shops:
  - id: domod
    name: Domod
    home: https://www.domod.ba
    search: https://domod.ba/pretraga?keywords={q}
    kinds: [appliances, furniture]

  - id: imtec
    name: Imtec
    home: https://www.imtec.ba
    search: https://imtec.ba/trazi?controller=search&s={q}
    kinds: [appliances]

  - id: technoshop
    name: Technoshop
    home: https://www.technoshop.ba
    search: https://technoshop.ba/?s={q}&post_type=product
    kinds: [appliances]
    render: true   # category listings are loaded by JavaScript
    pages:   # category pages list everything; the site's search is unreliable
      washer: [https://technoshop.ba/proizvodi/bijela-tehnika/ves-masine-i-susilice/ves-masine,
               https://technoshop.ba/proizvodi/bijela-tehnika/ves-masine-i-susilice/masine-za-pranje-i-susenje]
      dryer: [https://technoshop.ba/proizvodi/bijela-tehnika/ves-masine-i-susilice/susilice]
      dishwasher: [https://technoshop.ba/proizvodi/bijela-tehnika/pranje-posuda/samostojece-masine-za-sude,
                   https://technoshop.ba/proizvodi/bijela-tehnika/pranje-posuda/ugradbene-masine-za-sude]
      fridge: [https://technoshop.ba/proizvodi/bijela-tehnika/frizideri-i-zamrzivaci/kombinovani-frizideri,
               https://technoshop.ba/proizvodi/bijela-tehnika/frizideri-i-zamrzivaci/frizideri]
      tv: [https://technoshop.ba/proizvodi/tv-i-audio/tv]

  - id: tehnodepo
    name: Tehnodepo
    home: https://www.tehnodepo.ba
    search: https://tehnodepo.ba/shop?q={q}
    kinds: [appliances]
    pages:
      washer: [https://tehnodepo.ba/shop/bijela-tehnika/masine-za-pranje-vesa,
               https://tehnodepo.ba/shop/bijela-tehnika/masine-za-pranje-i-susenje-vesa]
      dryer: [https://tehnodepo.ba/shop/bijela-tehnika/masine-za-susenje-vesa]
      dishwasher: [https://tehnodepo.ba/shop/bijela-tehnika/masine-za-sude,
                   https://tehnodepo.ba/shop/ugradbena-tehnika/ugradbene-masine-za-sude]
      fridge: [https://tehnodepo.ba/shop/bijela-tehnika/frizideri]
      tv: [https://tehnodepo.ba/shop/televizori]

  - id: topizbor
    name: Topizbor
    home: https://www.topizbor.ba
    kinds: [appliances]
    pages:   # site search is JavaScript-only; category pages work
      washer: [https://topizbor.ba/masine-za-ves/masine-za-pranje-vesa, https://topizbor.ba/masine-za-ves/kombinovane-masine-za-ves]
      dryer: [https://topizbor.ba/masine-za-ves/masine-za-susenje-vesa]
      dishwasher: [https://topizbor.ba/masine-za-pranje-posudja/samostojece-masine-za-sudje,
                   https://topizbor.ba/masine-za-pranje-posudja/ugradbene-masine-za-sudje]
      fridge: [https://topizbor.ba/rashladni-aparati/frizideri-sa-zamrzivacem, https://topizbor.ba/rashladni-aparati/frizideri]
      tv: [https://topizbor.ba/televizori]

  - id: bingo
    name: Bingo
    home: https://bingoshop.ba
    search: https://bingoshop.ba/pretraga?keywords={q}
    kinds: [appliances]

  - id: fontele
    name: Fontele
    home: https://fontele.ba
    search: https://fontele.ba/pretraga?keywords={q}
    kinds: [appliances]

  - id: genelec
    name: Genelec
    home: https://genelec.ba
    search: https://genelec.ba/?post_type=product&dgwt_wcas=1&s={q}
    kinds: [appliances]
    items: [tv]          # mostly TVs and computers

  - id: procomp
    name: Procomp
    home: https://procomp.ba
    search: https://procomp.ba/search?controller=search&s={q}
    kinds: [appliances]
    items: [tv]

  - id: saga
    name: Saga
    home: https://saga-bih.com
    search: https://saga-bih.com/?post_type=product&s={q}
    kinds: [furniture]
    pages:
      sofa: [https://saga-bih.com/kategorija/namjestaj/dnevni-boravci/garniture/ugaone-garniture/]
      wardrobe: [https://saga-bih.com/kategorija/namjestaj/spavace-sobe/ormari/]

  - id: gama
    name: Gama
    home: https://www.gamashop.ba
    search: https://www.gamashop.ba/?s={q}&post_type=product
    kinds: [furniture]
    pages:
      wardrobe: [https://www.gamashop.ba/ormari]

  - id: jysk
    name: JYSK
    home: https://jysk.ba
    kinds: [furniture]
    render: true         # product lists are built by JavaScript
    pages:
      wardrobe: [https://jysk.ba/odlaganje/ormari]
      sofa: [https://jysk.ba/dnevna-soba/sofe, https://jysk.ba/dnevna-soba/modularne-sofe]
    strict_pages: [sofa]   # JYSK's sofa section mixes corner sofas with two-seaters and modules

  - id: olx
    name: OLX.ba
    home: https://olx.ba
    search: https://olx.ba/api/search?q={q}
    kinds: [appliances, furniture, everything]
    marketplace: true      # private sellers too: prices can be "po dogovoru", used items
    url_template: https://olx.ba/artikal/{id}
    alerts: false          # shown in the app, but no Telegram pings (too many used listings)

# Tested and left out:
#   blocked automated visits (HTTP 403): zeusbl.com, 3dbox.ba, dalusso.ba, deluxehome.ba, mirnanamjestaj.ba, kesten.ba, domavija.ba
#   no readable prices: zokielektronika.ba (JavaScript only), tehnomag.com (prices without currency), sinmax.ba, kalea.ba (no prices online)
#   not in BiH: Forma Ideale, Emmezeta, IKEA
candidates: []
