name: Map shops

# Finds each shop's search page and saves real pages to the "probe" branch for tuning.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe.request"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m tracker.probe --out /tmp/probe --render 2>&1 | tee /tmp/probe-log.txt
      - name: Publish results to the probe branch
        run: |
          cp /tmp/probe-log.txt /tmp/probe/log.txt
          cd /tmp/probe
          git init -q -b probe
          git config user.name "deal-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Probe $(date -u +'%F %H:%M') UTC"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
          cat REPORT.md >> "$GITHUB_STEP_SUMMARY"
