name: Map shops

# Finds each shop's search page and saves real pages to the "probe" branch for tuning.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = map every shop, pages = save category pages only, targets = test probe_targets.yaml"
        default: full
  push:
    branches: [main]
    paths: ["probe.request"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - env:
          MODE: ${{ inputs.mode }}
        run: |
          # a push to probe.request can pick the mode with a first line like "mode: details"
          if [ -z "$MODE" ]; then MODE=$(grep -m1 -oP '^mode:\s*\K\w+' probe.request || echo full); fi
          if [ "$MODE" = "chain" ]; then ARGS="--chain chain_lists.yaml"; elif [ "$MODE" = "details" ]; then ARGS="--catalog --details details_urls.yaml"; elif [ "$MODE" = "pages" ]; then ARGS="--pages"; elif [ "$MODE" = "targets" ]; then ARGS="--targets probe_targets.yaml"; else ARGS="--render"; fi
          python -m tracker.probe --out /tmp/probe $ARGS 2>&1 | tee /tmp/probe-log.txt
      - name: Publish results to the probe branch
        run: |
          cp /tmp/probe-log.txt /tmp/probe/log.txt
          cd /tmp/probe
          git init -q -b probe
          git config user.name "deal-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Probe $(date -u +'%F %H:%M') UTC"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
          cat REPORT.md PAGES.md TARGETS.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
